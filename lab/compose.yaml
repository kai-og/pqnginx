# Laboratorio: un servidor NGINX de Debian 13 y un contenedor desde el que corre la herramienta.
# Arrancar:   docker compose -f lab/compose.yaml up -d --build
# Comprobar:  docker compose -f lab/compose.yaml exec herramienta python3 -m pqnginx.verificar servidor --sni a.test --sni b.test
# Aplicar:    docker compose -f lab/compose.yaml exec herramienta python3 -m pqnginx.aplicar servidor --sni a.test --sni b.test --sin-comprobar-host
services:
  servidor:
    build:
      context: ..
      dockerfile: lab/servidor/Dockerfile
    hostname: servidor
    volumes:
      - claves:/claves

  herramienta:
    build: ./herramienta
    volumes:
      - ..:/app
      - claves:/claves
    working_dir: /app
    depends_on:
      - servidor
    command: ["sleep", "infinity"]

volumes:
  claves:
