# Estado inicial: una lista de grupos solo clásica, copiada de una guía antigua (Mozilla hasta la v5.7).
# Anula el híbrido que OpenSSL 3.5 activaría por defecto. Es lo que la herramienta tendrá que arreglar.
server {
    listen 443 ssl default_server;
    server_name a.test;
    ssl_certificate     /etc/nginx/lab-certs/cert.pem;
    ssl_certificate_key /etc/nginx/lab-certs/key.pem;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    location / { return 200 "a.test ok\n"; }
}

server {
    listen 443 ssl;
    server_name b.test;
    ssl_certificate     /etc/nginx/lab-certs/cert.pem;
    ssl_certificate_key /etc/nginx/lab-certs/key.pem;
    location / { return 200 "b.test ok\n"; }
}
